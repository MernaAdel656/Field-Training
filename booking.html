<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="blog.html">Blog</a>
        <a href="booking.html">booking</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
    </nav>
    <h1>Booking</h1>
    <form action="" class="booking-form">
    <label for="name">Name </label>
    <input type="text" id="name"><br>
    <label for="email">Email </label>
    <input type="email" id="email"><br>
    <label for="phone">Phone </label>
    <input type="phone" id="phone"><br>
    <label for="date">Arrival Date </label>
    <input type="date" id="date"><br>
    <label for="date-1">Departure Date </label>
    <input type="date" id="date-1"><br>
    <label for="room">Room Type</label>
    <select name="room" id="room">
        <option value="select Room">--Select Room--</option>
    </select>
    <fieldset>
        <legend>Services</legend>
        <input type="checkbox" id="checkbox">
        <label for="checkbox">Breakfast</label>
        <input type="checkbox" id="free">
        <label for="free">Free Wi-Fi</label>
    </fieldset>
    <fieldset>
        <legend>Payment</legend>
        <input type="radio" id="cash">
        <label for="cash">Cash</label>
        <input type="radio" id="card">
        <label for="card">Card</label>
    </fieldset>
    <label>Uploud ID</label>
    <input type="file"><br><br>
    <label for="">Notes</label>
    <textarea cols="30" rows="3px"></textarea><br><br>
    <button class="book">Book Now</button>
    </form>
</body>

</html>
